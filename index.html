<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="container nav">
            <h1>QuizMaster</h1>
            <a href="admin.html" class="nav-link">Admin</a>
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h2>Online Quiz Management System</h2>
            <p>Test your knowledge with our interactive multiple-choice quiz.</p>
        </section>

        <section id="quiz-card" class="card">
            <div class="quiz-header">
                <span id="progress">Loading...</span>
                <span id="score-preview">Score: 0</span>
            </div>

            <div id="quiz-container"></div>

            <div class="actions">
                <button id="next-btn" class="btn" disabled>Next Question</button>
                <button id="submit-btn" class="btn success" hidden>Submit Quiz</button>
            </div>
        </section>

        <p id="message" class="message"></p>
    </main>

    <script src="app.js"></script>
</body>
</html>
