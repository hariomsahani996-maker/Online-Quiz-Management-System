<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Result</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container result-page">
        <section class="card result-card">
            <h1>Quiz Completed</h1>
            <div class="result-score" id="result-score">0 / 0</div>
            <p id="result-percentage"></p>
            <a href="/" class="btn">Take Quiz Again</a>
        </section>
    </main>
    <script>
        const params = new URLSearchParams(location.search);
        const score = Number(params.get('score') || 0);
        const total = Number(params.get('total') || 0);
        const percentage = Number(params.get('percentage') || 0);
        document.getElementById('result-score').textContent = `${score} / ${total}`;
        document.getElementById('result-percentage').textContent =
            `Your score: ${percentage}%`;
    </script>
</body>
</html>
